<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexion - Celestial Parfums</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #e0e0e0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .offline { text-align: center; max-width: 400px; }
    .offline h1 { font-size: 1.5rem; color: #a78bfa; margin-bottom: 12px; }
    .offline p { color: #888; line-height: 1.6; margin-bottom: 20px; }
    .offline button { background: #8b5cf6; color: #fff; border: none; padding: 12px 24px;
      border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .offline button:hover { background: #7c3aed; }
  </style>
</head>
<body>
  <div class="offline">
    <h1>Sin conexion</h1>
    <p>Parece que no tienes conexion a internet. Revisa tu conexion e intenta de nuevo.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
